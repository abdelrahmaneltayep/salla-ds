<!-- Salla DS · Qty · <s-qty> · 5 variants -->
<!-- Runtime: https://dashboard-ui-components.pages.dev (admin-ui.esm.js + styles.css) -->

<!-- variant: default -->
<s-qty value="1" theme="default" layout="sides" min="1" max="100" step="1" placeholder="Enter Qty" class="s-qty s-qty--default"></s-qty>

<!-- variant: circular -->
<s-qty value="1" theme="circular" layout="sides" min="1" max="100" step="1" placeholder="Enter Qty" class="s-qty s-qty--circular"></s-qty>

<!-- variant: wide -->
<s-qty value="1" theme="default" layout="sides" min="1" max="100" step="1" placeholder="Enter Qty" wide="" class="s-qty s-qty--default w-full"></s-qty>

<!-- variant: min-max-values -->
<s-qty value="8" theme="default" layout="sides" min="5" max="10" step="1" placeholder="Enter Qty" class="s-qty s-qty--default"></s-qty>

<!-- variant: disabled -->
<s-qty value="1" theme="default" layout="sides" min="1" max="100" step="1" placeholder="Enter Qty" disabled="" class="s-qty s-qty--default disabled"></s-qty>
